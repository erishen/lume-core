name: Release

# 发布工作流: push 一个 v* tag(如 v0.5.0)时,在三个平台原生构建 bin/lume-core,
# 以 lume-core-<os>-<arch> 命名,附加到该 tag 的 GitHub Release(不存在则创建)。
# install.sh 用同样的命名约定从 releases/latest/download/ 下载,所以新增
# 平台只需要改这里的矩阵 + install.sh 的平台映射。
#
# push main / PR 也会跑同一个构建矩阵(不上传 asset),让平台构建问题在
# 发布前就暴露,而不是等到打 tag 才第一次编译。
#
# 注意: 矩阵并发往同一个 release 上传 asset。gh release upload 按 tag
# 操作,多 job 并行是安全用法;fail-fast: false 保证单平台失败不影响其它
# 平台产物。tag 之外的事件 GITHUB_TOKEN 只读,上传步骤全部有 if 守卫。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

# Only `build` attaches assets, so only `build` gets write.  A top-level
# contents: write used to grant it to every job on main/PR pushes too.
permissions:
  contents: read

# Never cancel a tagged release mid-upload: a half-attached
# asset set is worse than a queued build. Still grouped per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci.yml runs the full suite on v* tags, but two workflows cannot `needs:`
  # each other: a red CI run never stopped this workflow from uploading
  # assets.  Duplicating the essential legs here is what actually makes
  # "tests passed" a publish precondition.  Deps mirror ci.yml's test job so
  # both native emitters and the sql cross-backend legs are real, not skips.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev libsqlite3-dev
      - name: Parser / typechecker over every example
        run: make check
      - name: Full regression suite (both emitters, crypto, backend parity)
        run: make test
      - name: Privacy guard (build-machine paths + remote GC probe)
        run: make treecheck
      - name: Privacy guard (extended byte-level patterns over HEAD)
        run: make privacycheck
      - name: "Verify release version literals agree"
        run: make check-version

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lume-core-linux-x64
          - os: ubuntu-24.04-arm
            asset: lume-core-linux-arm64
          # Pinned arm64 label; keep in sync with ci.yml's release-build
          # matrix. All macOS 14 images retired 2026-11-02; macos-15 is arm64.
          - os: macos-15
            asset: lume-core-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # Makefile's LUME_CORE_VERSION is the single source for
      # `lume-core --version` and the LSP/MCP serverInfo. A tag published
      # while the binary reports another version is undetectable downstream.
      # ci.yml now gates v* tags with the full test matrix; this assertion
      # keeps release.yml itself honest about which version it is shipping.
      - name: "Assert release tag matches LUME_CORE_VERSION"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^LUME_CORE_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile | head -1 | tr -d '[:space:]')
          echo "tag=$tag Makefile LUME_CORE_VERSION=$declared"
          [ -n "$declared" ] || { echo "could not read LUME_CORE_VERSION from Makefile"; exit 1; }
          [ "$tag" = "$declared" ] || {
            echo "release tag $GITHUB_REF_NAME does not match LUME_CORE_VERSION $declared";
            echo "bump LUME_CORE_VERSION in Makefile before cutting the tag"; exit 1; }

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev

      - name: Build lume-core
        run: make

      - name: Smoke-check all examples
        run: make check

      - name: Report platform and binary type
        run: uname -s -m && file bin/lume-core

      # The release asset is a tarball, not a bare binary: the examples/ and
      # docs/ live in the repo and ride inside the artifact so an installed
      # binary can run `lume-core examples/hello.lume` out of the box. install.sh
      # only needs bin/lume-core, but carrying the rest costs nothing and helps.
      # Staging runs on every event (upload stays tag-only) so the checksum +
      # unpack verification below is exercised on main/PR, not only at release.
      - name: Stage release tarball
        run: |
          mkdir -p "dist/${{ matrix.asset }}/bin"
          cp bin/lume-core "dist/${{ matrix.asset }}/bin/"
          cp -r examples docs README.md README.zh.md CHANGELOG.md install.sh "dist/${{ matrix.asset }}/"
          # lib/: .lume 源码库。应用侧写 `import "../lume-core/lib/peer.lume"`,
          # 运行时由解释器按路径读 —— 它不是编进二进制的东西。不打进包的话,
          # 下游只能用"从源码树手工复制"的办法, 而手工副本会静默漂移
          # (曾出现镜像里放着 13KB 旧 peer.lume、源码已是 17KB, 报错却是
          #  "module 'peer' has no export 'config_warnings'")。
          cp -r lib "dist/${{ matrix.asset }}/"
          cd dist
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          fi

      # darwin: rebuild x86_64 via clang cross-compilation and stage a
      # second tarball. The arm64 runner's /opt/homebrew openssl is the
      # wrong slice for an x86_64 link, so the step below installs the
      # x86_64 openssl via Rosetta Homebrew and points OPENSSL_PREFIX at it.
      - name: Install x86_64 OpenSSL for darwin-x64 cross-build
        if: runner.os == 'macOS'
        run: |
          # The GitHub arm64 runner also carries an x86_64 (Rosetta) Homebrew
          # at /usr/local. If present, install openssl@4 there and link the
          # cross build against its x86_64 libs. If not, leave the var empty ->
          # HAVE_OPENSSL=0 -> the binary still links, just without http_*.
          # Non-fatal on main/PR: a missing Rosetta brew must not turn the
          # cross-build verification leg into a red build.
          if [ -x /usr/local/bin/brew ]; then
            arch -x86_64 /usr/local/bin/brew install openssl@4 || true
            echo "OPENSSL_X64_PREFIX=/usr/local/opt/openssl@4" >> "$GITHUB_ENV"
          else
            echo "OPENSSL_X64_PREFIX=" >> "$GITHUB_ENV"
          fi

      # Staged on every event (upload stays tag-only) so the *darwin-x64*
      # branch of the verifier below runs on main/PR too.
      - name: Cross-build darwin-x64 and stage tarball
        if: runner.os == 'macOS'
        run: |
          make clean
          make CC="clang -target x86_64-apple-darwin" OPENSSL_PREFIX="$OPENSSL_X64_PREFIX" bin/lume-core
          file bin/lume-core
          mkdir -p "dist/lume-core-darwin-x64/bin"
          cp bin/lume-core "dist/lume-core-darwin-x64/bin/"
          cp -r examples docs README.md README.zh.md CHANGELOG.md install.sh "dist/lume-core-darwin-x64/"
          cp -r lib "dist/lume-core-darwin-x64/"
          cd dist
          tar -czf lume-core-darwin-x64.tar.gz lume-core-darwin-x64
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum lume-core-darwin-x64.tar.gz > lume-core-darwin-x64.sha256
          else
            shasum -a 256 lume-core-darwin-x64.tar.gz > lume-core-darwin-x64.sha256
          fi

      # Verify before upload: a truncated/empty tarball, a mismatched
      # checksum or a missing payload directory must fail the build rather
      # than reach a tagged release. Runs on every event because staging
      # above now does too.
      - name: "Verify staged tarballs (checksum, unpack, binary smoke)"
        run: |
          set -e
          cd dist
          for pkg in *.tar.gz; do
            sum="${pkg%.tar.gz}.sha256"
            top_name="${pkg%.tar.gz}"
            echo "==> $pkg: checksum"
            [ -f "$sum" ] || { echo "missing checksum file $sum"; exit 1; }
            expected=$(awk 'NR==1 {print $1}' "$sum")
            if command -v sha256sum >/dev/null 2>&1; then
              actual=$(sha256sum "$pkg" | awk '{print $1}')
            else
              actual=$(shasum -a 256 "$pkg" | awk '{print $1}')
            fi
            [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
              echo "checksum mismatch for $pkg: $expected != $actual"; exit 1; }

            echo "==> $pkg: unpack + payload"
            work=$(mktemp -d)
            tar -xzf "$pkg" -C "$work"
            top="$work/$top_name"
            [ -d "$top" ] || { echo "missing top-level $top_name in $pkg"; exit 1; }
            binary=""
            for cand in lume lume-core; do
              if [ -x "$top/bin/$cand" ]; then binary="$top/bin/$cand"; break; fi
            done
            [ -n "$binary" ] || { echo "no executable under $top/bin"; exit 1; }
            [ -f "$top/install.sh" ] || { echo "missing install.sh in $pkg"; exit 1; }
            case "$pkg" in
              *-static*) : ;;  # static tarball ships only bin/ + install.sh
              *) [ -d "$top/examples" ] || { echo "missing examples/ in $pkg"; exit 1; } ;;
            esac

            # darwin-x64 is cross-built on an arm64 runner; executing it
            # depends on Rosetta, so verify its bytes but skip the exec.
            case "$pkg" in
              *darwin-x64*) echo "==> $pkg: cross-built x64, exec smoke skipped" ;;
              *) echo "==> $pkg: exec smoke"; "$binary" --help >/dev/null 2>&1 || {
                   echo "binary smoke failed: $binary"; exit 1; } ;;
            esac
            rm -rf "$work"
          done

      # upload-artifact@v5: node24 runtime — v4 targeted node20 and GitHub
      # forced it onto node24 with a deprecation warning on every run.
      # These artifacts are run artifacts only (inspection/debug); the actual
      # release assets are attached via the runner's gh CLI below.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        with:
          name: lume-core-darwin-x64
          path: dist/lume-core-darwin-x64.*
          if-no-files-found: error
          retention-days: 7

      # softprops/action-gh-release@v2 silently matches no files under the
      # forced Node-24 runtime (its files glob stops resolving relative to the
      # workspace), so assets are attached with the runner's own gh CLI.
      - name: Attach release assets (${{ matrix.asset }})
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ matrix.asset }}.tar.gz" "dist/${{ matrix.asset }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach cross-built darwin-x64 assets
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/lume-core-darwin-x64.tar.gz dist/lume-core-darwin-x64.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  # fail-fast: false lets one matrix leg fail while the others still upload.
  # install.sh fetches a fixed per-platform name from releases/latest, so a
  # half-set release is a 404 for that platform, not a soft degradation.
  # This job is the only place that asserts the set is complete; it also
  # turns a failed build matrix into a red release run instead of a green
  # one with partial assets.
  finalize:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Verify the complete release asset set"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build matrix result: ${{ needs.build.result }}"
            echo "the release may contain only a subset of the assets"
            exit 1
          fi
          assets=$(gh release view "$GITHUB_REF_NAME" \
                     --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '.assets[].name')
          missing=0
          for a in lume-core-linux-x64 lume-core-linux-arm64 \
                   lume-core-darwin-arm64 lume-core-darwin-x64; do
            for ext in tar.gz sha256; do
              name="$a.$ext"
              if ! printf '%s\n' "$assets" | grep -qx "$name"; then
                echo "MISSING asset: $name"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "release $GITHUB_REF_NAME has an incomplete asset set:"
            printf '%s\n' "$assets"
            exit 1
          fi
          echo "ok  complete release asset set: 4 tarballs + 4 checksums"
