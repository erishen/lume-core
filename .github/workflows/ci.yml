name: ci

# Nothing runs here until this file lands, so the first run is the one that
# proves the tree builds from a clean checkout. That is also why the two
# `apt-get` lines are explicit: `-lcrypt` and libLLVM are both optional to
# the Makefile (it probes for them) but the regression suite here wants them
# present, so the libLLVM leg and the crypto unit test are real legs and not
# skips.

on:
  push:
    branches: [main]
    # A v* tag is a release candidate. release.yml only builds and stages
    # tarballs, so without this leg a tag could publish a binary that never
    # passed the matrix test, LSan emitter gate, fuzz, pack privacy guard,
    # AI verification or the release-build matrix. Gate tags with the main set.
    tags:
      - 'v*'
  pull_request:

# Least privilege: every job here only reads the repo.  release.yml keeps
# contents: write on its build job because that one attaches assets.
permissions:
  contents: read

# A new push on the same ref supersedes the previous run;
# keep the long build/test matrices from queuing up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Byte-level privacy gate, independent so it turns around in seconds:
  # paths, private workspace tokens, credential shapes and sensitive
  # filenames over every HEAD blob, binaries included. The shell
  # treecheck stays for the build-machine-path + remote-GC-probe workflow;
  # this one covers the pattern classes that let a compiled CGI stay green
  # through a 2026 history scrub. Scope is HEAD only, never history.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: privacycheck (extended byte-level patterns over HEAD blobs)
        run: make privacycheck

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # Linux deps: libcrypt for -lcrypt, libLLVM for the second emitter,
      # libsqlite3-dev so the sql cross-backend legs in tests/native_backends.sh
      # (P6) are real legs on Linux rather than a skip.
      - name: Linux deps (libcrypt for -lcrypt, libLLVM for the second emitter)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev libsqlite3-dev

      # `make check` is the fast leg: the parser/type checker against every
      # example. `make test` adds the interpreter unit tests, the crypto unit
      # test, both native emitters and the backend parity check.
      - run: make check
      - run: make test
      # Redundant LSan emitter gate (A): --compile-text / --compile-llvm /
      # native_backends.sh under LSan also run here on Linux, so an emitter or
      # Val-ownership leak is caught even if the dedicated `asan` job is skipped
      # or renamed. macOS cannot run this (LSan unsupported), hence Linux-only.
      - name: LSan emitter gate (Linux only)
        if: runner.os == 'Linux'
        run: make asan-compile

  # The literal gcc:13-bookworm image named in the P14/P17 verification
  # notes. It used to be a hand-run coverage only (649f2df checked spawn
  # streaming there) because the dev machine has no docker and WSL launch
  # is blocked by local security policy. Make it a real CI leg instead:
  # gcc 13 + dash /bin/sh is a different toolchain from ubuntu-latest, and
  # `make test` is where the POSIX-only http_stream legs actually run.
  # The container runs as root (no sudo). python3 is for make test's
  # lib-compat leg; clang is mandatory because the IR-text backend
  # (src/backend_llvm.c) assembles its .ll with clang — gcc cannot parse
  # LLVM IR and enum-test's --compile-text leg dies without it.
  #
  # Deliberately NO libLLVM here (HAVE_LLVM=0): bookworm ships LLVM 14, and
  # --compile-llvm segfaults against that C API while ubuntu-latest's LLVM
  # 18 is green. The libLLVM emitter is covered there; this lane's job is
  # gcc 13 + dash /bin/sh, where the POSIX-only spawn/stream tests live.
  # All *_backends.sh and native-llvm already degrade to interp/text when
  # --compile-llvm is unavailable, so make test stays meaningful.
  bookworm:
    runs-on: ubuntu-latest
    container: gcc:13-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: container deps (libcrypt / libsqlite3 / clang / python3)
        run: apt-get update && apt-get install -y libcrypt-dev libsqlite3-dev clang python3
      - run: make HAVE_LLVM=0 ir-check
      - run: make HAVE_LLVM=0 check
      - run: make HAVE_LLVM=0 test

  # Leak detection only works here: LSan is unavailable on macOS (ASan says
  # "detect_leaks is not supported on this platform"), so this is the only
  # job that can actually see leaks. llvm-dev is installed on purpose so the
  # libLLVM leg runs for real rather than reporting a skip.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev
      - run: make -j4 asan
      # The for-in inline-temp iterable GC-root regression (tests/for-in-gc.lume)
      # must replay clean under ASan: before the fix the iterable lost its GC
      # root once popped off the stack, so body allocations tripped a
      # collection and the next round was a use-after-free (0xC0000005 on
      # Windows; ASan aborts here). The fixture prints PASS only when the
      # loop completed and the outputs are exact.
      - name: ASan - for-in GC-root regression
        run: ./bin/lume-core-asan tests/for-in-gc.lume | grep -q "^PASS for-in GC root regression"

  # Parser fuzzing in CI (promoted leg). ubuntu+clang only:
  # -fsanitize=fuzzer needs the clang runtime (gcc has none, Homebrew clang
  # ships none either). Two phases inside `make fuzz-ci` — a deterministic
  # -runs=1 seed replay over every tests/*.lume (regression tripwire,
  # seconds) and a 60s random campaign seeded from them. Crashers land in
  # out/fuzz-artifacts/ and are uploaded before the job fails, so a red
  # run arrives with its own minimizing input.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev clang
      - run: make fuzz-ci
        env:
          FUZZ_CC: clang
          CC: clang
          FUZZ_CI_BUDGET: 60
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: fuzz-artifacts
          path: out/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # The privacy guard lives inside `make pack`; running it here keeps the
  # tarball honest without anyone having to remember `make packcheck`.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev
      - run: make pack
      # `pack` already runs the same script inline; the standalone target is
      # run again so it is exercised too - it is what would fail if the
      # inline guard were dropped, since packcheck does not depend on pack
      # self-checking, only on the tarball existing.
      - run: make packcheck

  # TODO P4 AI self-verification loop — the deterministic machine half of
  # "AI writes, machine verifies". LLM-generated .lume programs have no
  # human .expected, so the gate accepts/rejects by backend equivalence
  # (type check + interp/IR-text/libLLVM output agreement + fuzz-driver
  # crash leg). This job runs it over the shipped examples so the libLLVM
  # leg is a real leg here (local toolchains often skip it), plus the
  # standalone fuzz driver so the crash leg is live too. The host-side
  # step that feeds actual LLM output into `make ai-verify` lives outside
  # the core per the TODO scope guard.
  ai-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev clang libsqlite3-dev
      - run: make fuzz-driver
      - run: make ai-verify
      - run: make ai-verify AI_VERIFY_FILE="examples/ai-generated/norm-stats.lume"
      - run: make ai-verify AI_VERIFY_FILE="examples/native-fact.lume"
      - run: make ai-verify AI_VERIFY_FILE="examples/stats.lume"
      - run: make ai-verify AI_VERIFY_FILE="examples/lang-basics.lume"
      # Scripted loop entry point: assert the expected verdicts over the
      # must-pass / must-reject seed sets and keep counter-examples in
      # out/ai-rejects.log, ready to hand back to the LLM for retry.
      - run: make ai-verify-loop
      # Producer half: the scripted "prompt → .lume" stand-in for the
      # host's LLM tool dispatch generates candidates, runs them through
      # the gate and asserts the manifest verdicts (accept → READY for
      # tests/, reject → counter-example logged, violation → red). This
      # is the leg that makes "AI writes, machine verifies" a closed
      # pipeline on CI, not just a file-reader.
      - run: make ai-produce

  # The release tree is produced by `.github/workflows/release.yml` on `v*`
  # tags; this job keeps the release matrix's plain build (no asset upload)
  # honest on every push to main / PR so a platform build break surfaces
  # before someone cuts a tag.
  release-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with release.yml's darwin-arm64 entry. macOS 14
        # retired 2026-11-02; macos-15 is the pinned arm64 GA label.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev
      - run: make
      - run: make check
