name: ci

# Nothing runs here until this file lands, so the first run is the one that
# proves the tree builds from a clean checkout. That is also why the two
# `apt-get` lines are explicit: `-lcrypt` and libLLVM are both optional to
# the Makefile (it probes for them) but the regression suite here wants them
# present, so the libLLVM leg and the crypto unit test are real legs and not
# skips.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Linux deps: libcrypt for -lcrypt, libLLVM for the second emitter,
      # libsqlite3-dev so the sql cross-backend legs in tests/native_backends.sh
      # (P6) are real legs on Linux rather than a skip.
      - name: Linux deps (libcrypt for -lcrypt, libLLVM for the second emitter)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev libsqlite3-dev

      # `make check` is the fast leg: the parser/type checker against every
      # example. `make test` adds the interpreter unit tests, the crypto unit
      # test, both native emitters and the backend parity check.
      - run: make check
      - run: make test

  # Leak detection only works here: LSan is unavailable on macOS (ASan says
  # "detect_leaks is not supported on this platform"), so this is the only
  # job that can actually see leaks. llvm-dev is installed on purpose so the
  # libLLVM leg runs for real rather than reporting a skip.
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev
      - run: make -j4 asan

  # Parser fuzzing in CI (promoted leg). ubuntu+clang only:
  # -fsanitize=fuzzer needs the clang runtime (gcc has none, Homebrew clang
  # ships none either). Two phases inside `make fuzz-ci` — a deterministic
  # -runs=1 seed replay over every tests/*.lume (regression tripwire,
  # seconds) and a 60s random campaign seeded from them. Crashers land in
  # out/fuzz-artifacts/ and are uploaded before the job fails, so a red
  # run arrives with its own minimizing input.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev clang
      - run: make fuzz-ci
        env:
          FUZZ_CC: clang
          CC: clang
          FUZZ_CI_BUDGET: 60
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: out/fuzz-artifacts/
          if-no-files-found: ignore

  # The privacy guard lives inside `make pack`; running it here keeps the
  # tarball honest without anyone having to remember `make packcheck`.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev
      - run: make pack
      # `pack` already runs the same script inline; the standalone target is
      # run again so it is exercised too - it is what would fail if the
      # inline guard were dropped, since packcheck does not depend on pack
      # self-checking, only on the tarball existing.
      - run: make packcheck

  # TODO P4 AI self-verification loop — the deterministic machine half of
  # "AI writes, machine verifies". LLM-generated .lume programs have no
  # human .expected, so the gate accepts/rejects by backend equivalence
  # (type check + interp/IR-text/libLLVM output agreement + fuzz-driver
  # crash leg). This job runs it over the shipped examples so the libLLVM
  # leg is a real leg here (local toolchains often skip it), plus the
  # standalone fuzz driver so the crash leg is live too. The host-side
  # step that feeds actual LLM output into `make ai-verify` lives outside
  # the core per the TODO scope guard.
  ai-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev clang
      - run: make fuzz-driver
      - run: make ai-verify
      - run: make ai-verify AI_VERIFY_FILE="examples/ai-generated/norm-stats.lume"
      - run: make ai-verify AI_VERIFY_FILE="examples/native-fact.lume"
      - run: make ai-verify AI_VERIFY_FILE="examples/stats.lume"
      - run: make ai-verify AI_VERIFY_FILE="examples/lang-basics.lume"
      # Scripted loop entry point: assert the expected verdicts over the
      # must-pass / must-reject seed sets and keep counter-examples in
      # out/ai-rejects.log, ready to hand back to the LLM for retry.
      - run: make ai-verify-loop

  # The release tree is produced by `.github/workflows/release.yml` on `v*`
  # tags; this job keeps the release matrix's plain build (no asset upload)
  # honest on every push to main / PR so a platform build break surfaces
  # before someone cuts a tag.
  release-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypt-dev llvm-dev
      - run: make
      - run: make check
