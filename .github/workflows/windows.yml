name: Windows (MSYS2)

# Native Windows build of lume-core via mingw-w64. The source carries
# #ifdef _WIN32 shims for the five platform-specific spots (--watch process
# model, mkdir/flock, realpath), and HTTP/TLS is opted out on Windows
# (Makefile excludes src/builtins_http.c and builds with LUME_HAS_HTTP=0).
# This workflow is the real verification gate for the Windows port: it
# compiles bin/lume-core.exe and exercises the interpreter + both native
# backends under an actual Windows toolchain.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-sqlite3

      # No external regex package is needed: the POSIX regex used by the
      # str_match/regex builtins is vendored under src/compat/regex (musl
      # libc's implementation, BSD-style licensed) and compiled into the
      # binary on Windows. This used to install libgnurx
      # (mingw-w64-ucrt-x86_64-libgnurx) for -lregex, but that package is no
      # longer resolvable from the MSYS2 repositories, and its LGPL license
      # is not compatible with vendoring into this MIT project.

      - name: Build
        run: make

      - name: Check (parse + type check every example)
        run: make check

      - name: Native backend (text)
        run: make native-text

      - name: Native backend (default)
        run: make native

      # P3 (full): the three-leg cross-backend consistency fixture. Unlike
      # the single-example `make native` / `make native-text` legs above,
      # tests/native_backends.sh runs tests/native-consistency.lume through
      # the interpreter and BOTH emitters, diffs each run against the
      # committed expected baseline (18 statistical distribution prints
      # included), diffs every leg pair against each other, and treats any
      # compiler diagnostic as a failure. Legs whose toolchain is missing
      # are skipped (text needs clang on PATH, libLLVM needs llvm-config in
      # the build), so the step is green both when the MSYS2 clang group
      # provides both and when only part of it is present.
      - name: Native consistency (interp + text + llvm)
        run: make native-consistency

      # P1 (Windows): the standalone driver shape of the parser fuzz entry
      # point. libFuzzer (-fsanitize=fuzzer) rejects the Windows GNU
      # targets, so this leg builds src/fuzz_target.c with
      # -DLUME_FUZZ_DRIVER (any compiler, mingw gcc included) and replays
      # the whole tests/ corpus - positive fixtures and the -bad/ negatives
      # - through lexer -> parse_program -> type checker in one process. A
      # crash/hang/leak in any seed is a regression of a fixed fuzz finding.
      - name: Fuzz driver seed replay
        run: make fuzz-driver

      # TODO P4 AI self-verification: the bash gate itself has never run
      # under a real Windows shell. This leg exercises
      # scripts/verify-ai-lume.sh end to end - type check + interp / text /
      # libLLVM output agreement - with the libLLVM leg live (the MSYS2
      # clang group ships llvm-config, so all three legs judge instead of
      # skipping). Any bash / CRLF / quoting incompatibility in the script
      # surfaces here, not in the Linux job.
      - name: AI self-verification gate (bash + 3 legs)
        run: make ai-verify
      - name: AI gate - generated stats seed
        run: make ai-verify AI_VERIFY_FILE="examples/ai-generated/norm-stats.lume"
      - name: AI gate - scripted loop (must-pass / must-reject verdicts)
        run: make ai-verify-loop
      - name: AI gate - producer (generate + gate + manifest verdicts)
        run: make ai-produce

      - name: Run hello
        run: ./bin/lume-core.exe examples/hello.lume

      # P3 (TODO): exercise the vendored POSIX regex (src/compat/regex, musl)
      # on Windows for real. str_match/regex are interpreter builtins (SPEC
      # §6.2 intentional boundary), so this is an interpreter leg: it links
      # the vendored regex into lume-core.exe at build time and executes
      # regcomp/regexec through native_str_match at runtime. The expected
      # outputs are spelled in the script's comments; a nonzero exit or an
      # assert-style mismatch shows up here.
      - name: Regex smoke (interpreter, vendored POSIX regex)
        run: ./bin/lume-core.exe examples/regex-smoke.lume

      # The full regression suite (`make test`) is POSIX-only: it exercises
      # HTTP/TLS builtins (http_get/http_post/...) that are deliberately
      # excluded from the Windows port (LUME_HAS_HTTP=0) and uses POSIX
      # mkdir(2)/rm -f shell calls. It runs on the Linux `ci` job instead.
      # Windows verification here is build + interpreter + module loading
      # (Check) + both native backends (text / default) + a hello run.
