name: Windows (MSYS2)

# Native Windows build of lume-core via mingw-w64. The source carries
# #ifdef _WIN32 shims for the five platform-specific spots (--watch process
# model, mkdir/flock, realpath), and HTTP/TLS is opted out on Windows
# (Makefile excludes src/builtins_http.c and builds with LUME_HAS_HTTP=0).
# This workflow is the real verification gate for the Windows port: it
# compiles bin/lume-core.exe and exercises the interpreter + both native
# backends under an actual Windows toolchain.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-clang

      - name: Build
        run: make

      - name: Check (parse + type check every example)
        run: make check

      - name: Native backend (text)
        run: make native-text

      - name: Native backend (default)
        run: make native

      - name: Run hello
        run: ./bin/lume-core examples/hello.lume

      # The full regression suite (`make test`) is POSIX-only: it exercises
      # HTTP/TLS builtins (http_get/http_post/...) that are deliberately
      # excluded from the Windows port (LUME_HAS_HTTP=0) and uses POSIX
      # mkdir(2)/rm -f shell calls. It runs on the Linux `ci` job instead.
      # Windows verification here is build + interpreter + module loading
      # (Check) + both native backends (text / default) + a hello run.
